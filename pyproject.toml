[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrender-mcp"
version = "0.1.0"
description = "MCP helper: URL to screenshot, PDF, or structured extract for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentRender" }]
keywords = ["mcp", "screenshot", "pdf", "extract", "ai-agents", "browser"]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.9,<3",
]

[project.urls]
Homepage = "https://agentrenderapi.com"
API = "https://api.agentrenderapi.com"

[project.scripts]
agentrender-mcp = "agentrender_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["agentrender_mcp"]
