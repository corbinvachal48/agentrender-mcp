[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrender-mcp"
version = "0.1.1"
description = "MCP server: URL to screenshot, PDF, or structured extract for AI agents. Free key: 150 renders/month, no card; then Starter $17/month."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentRender" }]
keywords = ["mcp", "screenshot", "pdf", "extract", "ai-agents", "browser"]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.9,<2",
]

[project.urls]
Homepage = "https://agentrenderapi.com"
API = "https://api.agentrenderapi.com"

[project.scripts]
agentrender-mcp = "agentrender_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["agentrender_mcp"]

[tool.hatch.build.targets.sdist]
include = ["agentrender_mcp", "README.md", "LICENSE", "pyproject.toml"]
